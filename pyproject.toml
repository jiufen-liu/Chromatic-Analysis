[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qtx-color-core"
version = "0.13.0"
description = "QTX spectral colour analysis core for Datacolor 600 exports"
requires-python = ">=3.11"
dependencies = [
    "colour-science==0.4.7",
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "PySide6>=6.7,<7",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
