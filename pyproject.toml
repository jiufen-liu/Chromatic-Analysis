[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qtx-color-core"
version = "0.13.0"
description = "QTX spectral colour analysis core for Datacolor 600 exports"
requires-python = ">=3.14,<3.15"
dependencies = [
    "colour-science==0.4.7",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "PySide6==6.11.2",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
